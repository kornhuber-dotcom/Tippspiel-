<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tippspiel Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }
        input[readonly] {
            background-color: #f9f9f9;
            color: #111;
            font-weight: bold;
        }
        button {
            margin-top: 12px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .btn-status { background-color: #e67e22; }
        .btn-pot { background-color: #d35400; }
        .btn-match { background-color: #2980b9; }
        .btn-ai { background-color: #8e44ad; }
        .btn-t1 { background-color: #e67e22; }
        .btn-t2 { background-color: #2980b9; }
        .btn-t3 { background-color: #27ae60; }
        .btn-t4 { background-color: #8e44ad; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚽ Tippspiel Manager</h2>

    <button id="statusBtn" class="btn-status">🎯 An der Reihe: Lädt...</button>

    <label>Aktueller Pott-Stand bisher (€):</label>
    <input type="number" id="pottBisher" value="12" oninput="saveData()">

    <button class="btn-pot" onclick="calculatePot()">💰 Pott am Wochenende: <span id="pottWochenende">16</span> Euro</button>

    <label>📅 Status / Info:</label>
    <input type="text" id="statusInfo" readonly value="Bitte Spiel auswählen">

    <label>Bundesliga-Spiel auswählen:</label>
    <select id="matchSelect" onchange="updateMatchSelection()">
        <option value="">Lade Spiele...</option>
    </select>

    <button class="btn-ai" onclick="runAiPrognosis()">🧠 Multi-Parameter KI-Prognose</button>

    <label>Dein Tipp (Ecki):</label>
    <input type="text" id="tipEcki" placeholder="z.B. 2:1" oninput="saveData()">

    <label>Tipp von Steffi:</label>
    <input type="text" id="tipSteffi" placeholder="z.B. 1:1" oninput="saveData()">

    <button class="btn-t1" onclick="shareText(1)">📧 Text 1: Steffi auffordern</button>
    <button class="btn-t2" onclick="shareText(2)">🎯 Text 2: Ecki wählt & tippt vor</button>
    <button class="btn-t3" onclick="shareText(3)">✅ Text 3: Beide Tipps stehen fest</button>
    <button class="btn-t4" onclick="shareText(4)">🏆 Text 4: Auswertung & Ergebnis abrufen</button>
</div>

<script>
    // Eingebauter Notfall-Spielplan, falls die API streikt
    const fallbackMatches = [
        { name: "FC Bayern München - Borussia Dortmund", home: "FC Bayern München", away: "Borussia Dortmund" },
        { name: "Bayer Leverkusen - RB Leipzig", home: "Bayer Leverkusen", away: "RB Leipzig" },
        { name: "VfB Stuttgart - Eintracht Frankfurt", home: "VfB Stuttgart", away: "Eintracht Frankfurt" },
        { name: "Borussia Mönchengladbach - Werder Bremen", home: "Borussia Mönchengladbach", away: "Werder Bremen" },
        { name: "1. FC Union Berlin - SC Freiburg", home: "1. FC Union Berlin", away: "SC Freiburg" }
    ];

    let currentMatches = [];

    // Kaderstärken-Matrix als Basis für die KI-Prognose
    const powerRankings = {
        "FC Bayern München": 95,
        "Bayer Leverkusen": 90,
        "RB Leipzig": 88,
        "Borussia Dortmund": 86,
        "VfB Stuttgart": 82,
        "Eintracht Frankfurt": 80,
        "SC Freiburg": 76,
        "1. FC Union Berlin": 74,
        "Borussia Mönchengladbach": 73,
        "Werder Bremen": 72,
        "VfL Wolfsburg": 72,
        "TSG Hoffenheim": 71,
        "1. FSV Mainz 05": 70,
        "FC Augsburg": 68,
        "1. FC Heidenheim": 66,
        "VfL Bochum": 65,
        "FC St. Pauli": 64,
        "Holstein Kiel": 62
    };

    function loadData() {
        if (localStorage.getItem('pottBisher')) {
            document.getElementById('pottBisher').value = localStorage.getItem('pottBisher');
        }
        if (localStorage.getItem('tipEcki')) {
            document.getElementById('tipEcki').value = localStorage.getItem('tipEcki');
        }
        if (localStorage.getItem('tipSteffi')) {
            document.getElementById('tipSteffi').value = localStorage.getItem('tipSteffi');
        }
        calculatePot();
        fetchMatches();
    }

    function saveData() {
        localStorage.setItem('pottBisher', document.getElementById('pottBisher').value);
        localStorage.setItem('tipEcki', document.getElementById('tipEcki').value);
        localStorage.setItem('tipSteffi', document.getElementById('tipSteffi').value);
        calculatePot();
    }

    function calculatePot() {
        let pott = parseFloat(document.getElementById('pottBisher').value) || 0;
        let total = pott + 4;
        document.getElementById('pottWochenende').innerText = total;
    }

    async function fetchMatches() {
        const select = document.getElementById('matchSelect');
        select.innerHTML = '<option value="">Lade aktuelle Spiele...</option>';
        
        try {
            // Versuch über API
            const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.openligadb.de/getmatchdata/bl1/2026'));
            if (!response.ok) throw new Error('Netzwerkfehler');
            const data = await response.json();
            const parsedData = JSON.parse(data.contents);
            
            if (!parsedData || parsedData.length === 0) throw new Error('Keine Daten');

            currentMatches = parsedData.map(match => ({
                name: `${match.team1.teamName} - ${match.team2.teamName}`,
                home: match.team1.teamName,
                away: match.team2.teamName
            }));
            fillMatchDropdown();
        } catch (error) {
            // Automatischer Fallback, damit die App sofort wieder läuft
            console.warn("API blockiert, nutze Notfall-Spielplan.");
            currentMatches = fallbackMatches;
            fillMatchDropdown();
        }
    }

    function fillMatchDropdown() {
        const select = document.getElementById('matchSelect');
        select.innerHTML = '<option value="">-- Bitte Spiel wählen --</option>';
        currentMatches.forEach((match, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.text = match.name;
            select.appendChild(opt);
        });
        document.getElementById('statusInfo').value = "Bereit zum Tippen";
    }

    function updateMatchSelection() {
        let index = document.getElementById('matchSelect').value;
        if (index === "") {
            document.getElementById('statusInfo').value = "Bitte Spiel auswählen";
        } else {
            document.getElementById('statusInfo').value = "Spiel ausgewählt";
        }
    }

    function runAiPrognosis() {
        let index = document.getElementById('matchSelect').value;
        if (index === "") {
            alert("Bitte zuerst ein Bundesliga-Spiel auswählen!");
            return;
        }

        let match = currentMatches[index];
        let homeTeam = match.home;
        let awayTeam = match.away;

        let strengthHome = powerRankings[homeTeam] || 70;
        let strengthAway = powerRankings[awayTeam] || 70;

        // Heimvorteil-Bonus
        strengthHome += 4;

        let diff = strengthHome - strengthAway;
        let goalsHome, goalsAway;

        if (diff > 10) {
            goalsHome = Math.floor(Math.random() * 2) + 2; // 2 bis 3
            goalsAway = Math.floor(Math.random() * 2);     // 0 bis 1
        } else if (diff < -10) {
            goalsHome = Math.floor(Math.random() * 2);     // 0 bis 1
            goalsAway = Math.floor(Math.random() * 2) + 2; // 2 bis 3
        } else {
            goalsHome = Math.floor(Math.random() * 3);     // 0 bis 2
            goalsAway = Math.floor(Math.random() * 3);     // 0 bis 2
        }

        document.getElementById('tipEcki').value = `${goalsHome}:${goalsAway}`;
        saveData();
    }

    function shareText(type) {
        let matchIndex = document.getElementById('matchSelect').value;
        let matchName = matchIndex !== "" ? currentMatches[matchIndex].name : "das kommende Spiel";
        let eckiTip = document.getElementById('tipEcki').value || "?:?";
        let steffiTip = document.getElementById('tipSteffi').value || "?:?";
        let pottTotal = document.getElementById('pottWochenende').innerText;

        let text = "";
        if (type === 1) {
            text = `Hey Steffi! Für ${matchName} steht unser Bundesliga-Tippspiel an. Der Pott liegt bei ${pottTotal} Euro! Gib mal deinen Tipp ab. ⚽🔥`;
        } else if (type === 2) {
            text = `Hey Steffi! Ich habe für ${matchName} vorgelegt und tippe auf ${eckiTip}. Jetzt bist du dran! 🎯`;
        } else if (type === 3) {
            text = `Fix & Fertig für ${matchName}: Ecki tippt ${eckiTip}, Steffi tippt ${steffiTip}. Möge der Bessere gewinnen! 🍻⚽`;
        } else if (type === 4) {
            text = `Auswertung für ${matchName}! Ecki (${eckiTip}) vs Steffi (${steffiTip}) im Kampf um den ${pottTotal}-Euro-Pott! 🏆`;
        }

        if (navigator.share) {
            navigator.share({ title: 'Tippspiel', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            alert("Text in die Zwischenablage kopiert!");
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
