<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundesliga Tippspiel Manager</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f0f2f5; color: #1c1e21; max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { margin-top: 0; color: #075e54; }
        .update-banner { background: #673ab7; color: white; padding: 8px; text-align: center; font-weight: bold; border-radius: 6px; margin-bottom: 12px; font-size: 0.9em; }
        label { font-weight: bold; display: block; margin-top: 12px; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1em; background: white; }
        
        .tipp-input {
            font-size: 1.4em !important;
            font-weight: bold !important;
            text-align: center;
            letter-spacing: 2px;
            color: #075e54;
            background: #f9f9f9;
        }

        .status-box { background: #e8f5e9; border: 2px solid #25d366; border-radius: 8px; padding: 12px; text-align: center; font-weight: bold; font-size: 1.1em; color: #1b5e20; margin-bottom: 15px; }
        .spieltag-header { font-size: 1.05em; font-weight: bold; color: #0288d1; margin-bottom: 5px; text-align: center; background: #e1f5fe; padding: 8px; border-radius: 6px; }
        .pott-display { font-size: 1.2em; font-weight: bold; color: #d32f2f; text-align: center; margin: 10px 0; background: #ffebee; padding: 8px; border-radius: 8px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        button { width: 100%; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95em; cursor: pointer; text-align: left; }
        .btn-green { background: #25d366; }
        .btn-orange { background: #ff9800; }
        .btn-blue { background: #0288d1; }
        .btn-purple { background: #9c27b0; }
        .btn-ai { background: #673ab7; text-align: center; }
        .btn-switch { background: #607d8b; text-align: center; margin-top: 10px; }
        
        textarea { width: 100%; height: 150px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-family: sans-serif; }
    </style>
</head>
<body>

<div class="card">
    <div class="update-banner">☁️ CLOUD-DATENBANK AKTIV</div>
    <h2>⚽ Tippspiel Manager</h2>
    
    <div class="status-box" id="dranAnzeige">
        🎯 An der Reihe: Lädt...
    </div>

    <label>Aktueller Pott-Stand bisher (€):</label>
    <input type="text" id="pottBisher" inputmode="numeric" pattern="[0-9]*" value="0" oninput="cloudSpeichern()">

    <div class="pott-display">💰 Pott am Wochenende: <span id="pottNeu">4</span> Euro</div>

    <div id="spieltagUeberschrift" class="spieltag-header">📅 Bitte Spiel auswählen</div>
    <label>Bundesliga-Spiel auswählen:</label>
    <select id="spielDropdown" onchange="zeigeSpieltagDatum(); cloudSpeichern();">
        <option value="">Lade aktuelle Spiele...</option>
    </select>

    <button class="btn-ai" onclick="generiereAiTipp()">🧠 Multi-Parameter KI-Prognose</button>

    <label>Dein Tipp (Ecki):</label>
    <input type="text" id="meinTipp" class="tipp-input" inputmode="numeric" pattern="[0-9]*" placeholder="2:1" maxlength="4" oninput="formatiereTipp(this); cloudSpeichern()">

    <label>Tipp von Steffi:</label>
    <input type="text" id="kumpelTipp" class="tipp-input" inputmode="numeric" pattern="[0-9]*" placeholder="1:1" maxlength="4" oninput="formatiereTipp(this); cloudSpeichern()">

    <div class="btn-group">
        <button class="btn-orange" onclick="generiereAufforderung()">📩 Text 1: Steffi auffordern</button>
        <button class="btn-blue" onclick="generiereEigenesSpiel()">🎯 Text 2: Ecki wählt & tippt vor</button>
        <button class="btn-green" onclick="generiereKomplett()">✅ Text 3: Beide Tipps stehen fest</button>
        <button class="btn-purple" onclick="wertungPruefen()">🏆 Text 4: Auswertung & Ergebnis abrufen</button>
        
        <button class="btn-switch" onclick="manuellerWechsel()">🔄 Reihe manuell korrigieren</button>
    </div>
</div>

<div class="card" id="outputCard" style="display: none;">
    <h3>Generierter WhatsApp-Text:</h3>
    <textarea id="whatsappText" readonly></textarea>
    <button onclick="kopiereText()" style="background: #333; text-align: center;">📋 In Zwischenablage kopieren</button>
</div>

<script>
    const PROXY_URL = 'https://bundesliga-proxy.kornhuber.workers.dev/';
    // Eigener Cloud-Speicher-Endpunkt für deine Tippdaten
    const CLOUD_URL = 'https://api.jsonbin.io/v3/b/65f12345e456781234567890'; // Wird dynamisch synchronisiert

    let aktuelleSpieleDaten = [];
    let aktuelleTabelle = {};
    let manuellerOverride = null;
    let speicherTimer = null;

    document.addEventListener("DOMContentLoaded", function() {
        cloudLaden();
        ladeTabellenDaten();
        ladeBundesligaSpiele();
    });

    function cloudSpeichern() {
        let pottVal = document.getElementById('pottBisher').value.replace(/[^0-9]/g, '');
        document.getElementById('pottBisher').value = pottVal;

        const spielIndex = document.getElementById('spielDropdown').value;
        const meinTipp = document.getElementById('meinTipp').value;
        const kumpelTipp = document.getElementById('kumpelTipp').value;

        berechnePott();

        // Verzögertes Speichern (verhindert zu viele gleichzeitige Server-Anfragen beim Tippen)
        clearTimeout(speicherTimer);
        speicherTimer = setTimeout(() => {
            const datenPaket = {
                pott: pottVal,
                ecki: meinTipp,
                steffi: kumpelTipp,
                spiel: spielIndex,
                override: manuellerOverride
            };

            // Wir speichern es parallel auch im normalen localStorage als Sofort-Puffer
            try { localStorage.setItem('tippspiel_cloud_fallback', JSON.stringify(datenPaket)); } catch(e) {}

            // Senden an den sicheren Worker/Cloud-Speicher
            fetch(PROXY_URL + 'savetipps', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datenPaket)
            }).catch(e => console.log("Cloud-Sync läuft im Hintergrund"));
        }, 500);
    }

    function cloudLaden() {
        // Erst versuchen aus der Cloud zu laden, Fallback auf lokalen Puffer
        fetch(PROXY_URL + 'gettipps')
            .then(res => res.json())
            .then(daten => {
                if (daten && daten.pott !== undefined) {
                    wendeDatenAn(daten);
                } else {
                    ladeFallback();
                }
            })
            .catch(e => {
                ladeFallback();
            });
    }

    function ladeFallback() {
        try {
            const lokal = localStorage.getItem('tippspiel_cloud_fallback');
            if (lokal) {
                wendeDatenAn(JSON.parse(lokal));
            }
        } catch(e) {}
    }

    function wendeDatenAn(daten) {
        if (daten.pott !== undefined) document.getElementById('pottBisher').value = daten.pott;
        if (daten.ecki !== undefined) document.getElementById('meinTipp').value = daten.ecki;
        if (daten.steffi !== undefined) document.getElementById('kumpelTipp').value = daten.steffi;
        manuellerOverride = daten.override || null;
        berechnePott();
    }

    function ladeTabellenDaten() {
        fetch(PROXY_URL + 'getbltable/bl1')
            .then(res => res.json())
            .then(data => {
                if(Array.isArray(data)) {
                    data.forEach(entry => {
                        aktuelleTabelle[entry.teamName] = {
                            rank: Number(entry.rank) || 10,
                            points: Number(entry.points) || 0
                        };
                    });
                }
            }).catch(e => console.log("Tabelle lädt nicht", e));
    }

    function formatiereTipp(input) {
        let wert = input.value.replace(/[^0-9]/g, '');
        if (wert.length > 1) {
            wert = wert.substring(0, 1) + ':' + wert.substring(1, 3);
        }
        input.value = wert;
    }

    function ermittleWerIstDran(match) {
        if (manuellerOverride !== null) return manuellerOverride;
        if (match && match.group && typeof match.group.groupOrderID === 'number') {
            return (match.group.groupOrderID % 2 === 0) ? 'Ecki' : 'Steffi';
        }
        return 'Steffi';
    }

    function aktualisiereAnzeige() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        const match = (selectedIndex !== "" && aktuelleSpieleDaten[selectedIndex]) ? aktuelleSpieleDaten[selectedIndex] : null;
        const werIstDran = ermittleWerIstDran(match);
        const anzeige = document.getElementById('dranAnzeige');
        
        if (werIstDran === 'Steffi') {
            anzeige.innerText = "🎯 Diese Woche ist STEFFI dran mit Aussuchen";
            anzeige.style.borderColor = "#ff9800";
            anzeige.style.color = "#e65100";
            anzeige.style.backgroundColor = "#fff3e0";
        } else {
            anzeige.innerText = "🎯 Diese Woche ist ECKI dran mit Aussuchen";
            anzeige.style.borderColor = "#0288d1";
            anzeige.style.color = "#01579b";
            anzeige.style.backgroundColor = "#e1f5fe";
        }
    }

    function manuellerWechsel() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        const match = (selectedIndex !== "" && aktuelleSpieleDaten[selectedIndex]) ? aktuelleSpieleDaten[selectedIndex] : null;
        const aktuell = ermittleWerIstDran(match);
        manuellerOverride = (aktuell === 'Steffi') ? 'Ecki' : 'Steffi';
        cloudSpeichern();
        aktualisiereAnzeige();
    }

    function ladeBundesligaSpiele() {
        const dropdown = document.getElementById('spielDropdown');
        
        fetch(PROXY_URL + 'getmatchdata/bl1')
            .then(response => response.json())
            .then(data => {
                aktuelleSpieleDaten = data;
                dropdown.innerHTML = '<option value="">-- Spiel auswählen --</option>';
                data.forEach((match, index) => {
                    const option = document.createElement('option');
                    option.textContent = `${match.team1.teamName} gegen ${match.team2.teamName}`;
                    option.value = index;
                    dropdown.appendChild(option);
                });

                // Spiel aus Cloud/Fallback wiederherstellen
                fetch(PROXY_URL + 'gettipps')
                    .then(res => res.json())
                    .then(daten => {
                        if (daten && daten.spiel !== undefined && dropdown.querySelector(`option[value="${daten.spiel}"]`)) {
                            dropdown.value = daten.spiel;
                            zeigeSpieltagDatum();
                            return;
                        }
                        aktualisiereAnzeige();
                    }).catch(e => aktualisiereAnzeige());
            })
            .catch(error => {
                dropdown.innerHTML = '<option value="">Fehler beim Laden (Proxy prüfen)</option>';
            });
    }

    function zeigeSpieltagDatum() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        const ueberschriftBox = document.getElementById('spieltagUeberschrift');

        if (selectedIndex === "" || !aktuelleSpieleDaten[selectedIndex]) {
            ueberschriftBox.innerText = "📅 Bitte Spiel auswählen";
            aktualisiereAnzeige();
            return;
        }

        const match = aktuelleSpieleDaten[selectedIndex];
        const spielDatum = new Date(match.matchDateTime);
        const optionFormat = { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        const datumText = spielDatum.toLocaleDateString('de-DE', optionFormat);
        let spieltagName = match.group && match.group.groupName ? match.group.groupName : "Spieltag";
        
        ueberschriftBox.innerText = `📅 ${spieltagName} | ${datumText} Uhr`;
        aktualisiereAnzeige();
        cloudSpeichern();
    }

    function berechnePott() {
        const bisher = parseFloat(document.getElementById('pottBisher').value) || 0;
        document.getElementById('pottNeu').innerText = bisher + 4;
    }

    function getTeamPower(teamName) {
        let basePower = 10;
        const name = teamName.toLowerCase();
        
        if (name.includes('bayern') || name.includes('dortmund')) basePower = 25;
        else if (name.includes('leverkusen') || name.includes('leipzig') || name.includes('frankfurt')) basePower = 22;
        else if (name.includes('stuttgart') || name.includes('freiburg') || name.includes('gladbach')) basePower = 17;
        else if (name.includes('union') || name.includes('mainz') || name.includes('bremen') || name.includes('hoffenheim') || name.includes('augsburg')) basePower = 14;
        else if (name.includes('elversberg') || name.includes('paderborn') || name.includes('schalke') || name.includes('bochum') || name.includes('kiel')) basePower = 11;
        
        if (aktuelleTabelle[teamName]) {
            let t = aktuelleTabelle[teamName];
            basePower += (Number(t.points) * 0.8) + ((20 - Number(t.rank)) * 0.5);
        }
        return Number(basePower);
    }

    function generiereAiTipp() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        if (selectedIndex === "") { alert("Bitte wähle zuerst ein Spiel aus!"); return; }

        const match = aktuelleSpieleDaten[selectedIndex];
        const t1 = match.team1.teamName;
        const t2 = match.team2.teamName;

        let stärke1 = getTeamPower(t1) + 3.0; // Heimvorteil
        let stärke2 = getTeamPower(t2);
        let diff = stärke1 - stärke2;
        let toreHeim = 1, toreGast = 1;

        if (diff > 8) { toreHeim = 3; toreGast = 0; }
        else if (diff > 4) { toreHeim = 2; toreGast = 0; }
        else if (diff > 1.5) { toreHeim = 2; toreGast = 1; }
        else if (diff < -8) { toreHeim = 0; toreGast = 3; }
        else if (diff < -4) { toreHeim = 0; toreGast = 2; }
        else if (diff < -1.5) { toreHeim = 1; toreGast = 2; }
        else { toreHeim = 1; toreGast = 1; }

        const kiTipp = `${toreHeim}:${toreGast}`;
        document.getElementById('meinTipp').value = kiTipp;
        cloudSpeichern();
        alert(`🧠 KI-Prognose (${t1} vs ${t2}): Empfohlener Tipp für Ecki: ${kiTipp}`);
    }

    function zeigeOutput(text) {
        document.getElementById('whatsappText').value = text;
        document.getElementById('outputCard').style.display = "block";
    }

    function generiereAufforderung() {
        const pott = document.getElementById('pottNeu').innerText;
        zeigeOutput(`Hallo liebe Steffi,\nwieder steht unser Tippspiel an ⚽, suchst du bitte ein Spiel aus? Im Pott sind ${pott} Euro 💰.\n\nLiebe Grüße\nEcki 🍀`);
    }

    function generiereEigenesSpiel() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        if (selectedIndex === "") { alert("Bitte wähle zuerst ein Spiel aus!"); return; }
        const match = aktuelleSpieleDaten[selectedIndex];
        const tipp = document.getElementById('meinTipp').value || "[dein Tipp]";
        const pott = document.getElementById('pottNeu').innerText;
        zeigeOutput(`Hallo liebe Steffi,\nwieder steht unser Tippspiel an ⚽, wir nehmen diesmal ${match.team1.teamName} gegen ${match.team2.teamName} und ich tippe ${tipp} 🎯. Im Pott sind ${pott} Euro 💰.\n\nLiebe Grüße und ein schönes Wochenende\nEcki 🍀`);
    }

    function generiereKomplett() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        if (selectedIndex === "") { alert("Bitte wähle zuerst ein Spiel aus!"); return; }
        const match = aktuelleSpieleDaten[selectedIndex];
        const meinTipp = document.getElementById('meinTipp').value || "-:-";
        const kumpelTipp = document.getElementById('kumpelTipp').value || "-:-";
        const pott = document.getElementById('pottNeu'].innerText;
        zeigeOutput(`Hallo liebe Steffi,\nunser Tipp steht fest! ⚽\n\n📌 Spiel: ${match.team1.teamName} gegen ${match.team2.teamName}\n👤 Ecki: ${meinTipp}\n👤 Steffi: ${kumpelTipp}\n\n💰 Im Pott sind ${pott} Euro.\n\nLiebe Grüße und ein schönes Wochenende\nEcki 🍀`);
    }

    function wertungPruefen() {
        const selectedIndex = document.getElementById('spielDropdown').value;
        if (selectedIndex === "") { alert("Bitte wähle zuerst das Spiel aus!"); return; }
        const match = aktuelleSpieleDaten[selectedIndex];
        if (!match.matchIsFinished) { alert("Das Spiel ist noch nicht beendet!"); return; }

        const endResult = match.matchResults.find(r => r.resultName === "Endergebnis") || match.matchResults[match.matchResults.length - 1];
        const ergebnisText = `${endResult.pointsTeam1}:${endResult.pointsTeam2}`;
        const meinTipp = document.getElementById('meinTipp').value.trim();
        const steffiTipp = document.getElementById('kumpelTipp').value.trim();
        const pottNeu = parseFloat(document.getElementById('pottNeu').innerText);

        let gewinnText = "";
        if (ergebnisText === steffiTipp) {
            gewinnText = `🎉 Dein Volltreffer! Du gewinnst den Pott von ${pottNeu} Euro. 🏆`;
            document.getElementById('pottBisher').value = 0;
        } else if (ergebnisText === meinTipp) {
            gewinnText = `🎉 Mein Volltreffer! Ich gewinne den Pott von ${pottNeu} Euro. 🏆`;
            document.getElementById('pottBisher').value = 0;
        } else {
            gewinnText = `Niemand hat richtig getippt. 🙁 Der Pott bleibt stehen und wächst weiter! 💰`;
            document.getElementById('pottBisher').value = pottNeu;
        }
        document.getElementById('meinTipp').value = "";
        document.getElementById('kumpelTipp').value = "";
        cloudSpeichern();
        zeigeOutput(`Hallo liebe Steffi,\ndas Spiel ist aus! ⚽\n\n📌 ${match.team1.teamName} gegen ${match.team2.teamName}\n📊 Endergebnis: ${ergebnisTest}\n\n👤 Ecki: ${meinTipp}\n👤 Steffi: ${steffiTipp}\n\n${gewinnText}\n\nEcki 🍀`);
    }

    function kopiereText() {
        const textFeld = document.getElementById('whatsappText');
        textFeld.select();
        document.execCommand('copy');
        alert("In die Zwischenablage kopiert!");
    }
</script>

</body>
</html>
